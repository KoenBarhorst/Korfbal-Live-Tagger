  function validateSubstitution(){if(!substitutionDraft?.playerOutId||!substitutionDraft?.playerInId)return invalid("Kies een speler uit en een speler in.");const playerOut=findPlayer(substitutionDraft.playerOutId);const playerIn=findPlayer(substitutionDraft.playerInId);if(!playerOut||!playerIn||!playerOut.active||playerIn.active)return invalid("De gekozen wisselspelers zijn niet meer beschikbaar.");if(playerOut.player_gender!==playerIn.player_gender)return invalid("D kan alleen D vervangen en H alleen H.");return valid();}

function canonicalPointToLiveScreenPoint(canonicalX,canonicalY,physicalSide){if(!["left","right"].includes(physicalSide))throw new Error("Ongeldige fysieke veldzijde");const x=Number(canonicalX),y=Number(canonicalY);if(!Number.isFinite(x)||!Number.isFinite(y))throw new Error("Ongeldige canonieke coördinaten");return physicalSide==="left"?{x:100-y,y:x}:{x:y,y:100-x};}

  function playersStepHtml(){const visible=Math.min(8,Math.max(1,Number(appState.visibleReserveCount)||1));return`<div class="players-layout"><section class="card"><h2>Starters</h2><h3>Vak A</h3><div class="starter-grid">${appState.starters.slice(0,4).map(player=>playerInputHtml(player,"starter")).join("")}</div><h3 style="margin-top:8px">Vak B</h3><div class="starter-grid">${appState.starters.slice(4).map(player=>playerInputHtml(player,"starter")).join("")}</div></section><section class="card"><h2>Wisselspelers</h2><div class="reserve-grid">${appState.reserves.slice(0,visible).map(player=>playerInputHtml(player,"reserve")).join("")}</div>${visible<8?`<button id="addReserveButton" class="add-reserve-button" type="button">+ Wisselspeler toevoegen</button>`:""}</section></div><div class="actions"><button id="playersBackButton" type="button">Terug</button><button id="playersNextButton" class="primary" type="button">Verder</button></div>`;}  
  function lineupStepHtml(){const starterCard=sectionId=>`<section class="lineup-card"><h3>Vak ${sectionId}</h3>${appState.starters.filter(player=>player.section_id===sectionId).map(player=>`<div class="lineup-player-row"><span class="lineup-player-name" title="${escapeHtml(player.player_name)}">${escapeHtml(player.player_name)}</span><span class="lineup-player-gender">${genderIconHtml(player.player_gender)}</span></div>`).join("")}</section>`;const reserves=appState.reserves.filter(player=>player.player_name);return`<section class="card"><h2>Opstelling controleren</h2><div class="lineup-review-grid">${starterCard("A")}${starterCard("B")}<section class="lineup-card lineup-reserves"><h3>Reserves</h3>${reserves.length?`<div class="lineup-reserve-grid">${reserves.map(player=>`<div class="lineup-player-row"><span class="lineup-player-name" title="${escapeHtml(player.player_name)}">${escapeHtml(player.player_name)}</span><span class="lineup-player-gender">${genderIconHtml(player.player_gender)}</span></div>`).join("")}</div>`:`<div class="lineup-empty">Geen reserves ingevuld.</div>`}</section></div></section><div class="actions"><button id="lineupBackButton" type="button">Terug</button><button id="lineupNextButton" class="primary" type="button">Verder</button></div>`;}

function attachWizardListeners(){if(appState.wizardStep===1)attachMatchStepListeners();if(appState.wizardStep===2)attachPlayersStepListeners();if(appState.wizardStep===3){document.getElementById("lineupBackButton").addEventListener("click",()=>{appState.wizardStep=2;renderApp();});document.getElementById("lineupNextButton").addEventListener("click",()=>{const check=validateLineupStep();if(!check.valid)return displayWizardError(check);appState.wizardStep=4;renderApp();});}if(appState.wizardStep===4){document.getElementById("startStepBackButton").addEventListener("click",()=>{appState.wizardStep=3;persistState();renderApp();});document.getElementById("startSectionA").addEventListener("click",()=>selectStartSection("A"));document.getElementById("startSectionB").addEventListener("click",()=>selectStartSection("B"));document.getElementById("initialOwnAttackLeft").addEventListener("click",()=>{appState.initialOwnAttackSide="left";renderApp();});document.getElementById("initialOwnAttackRight").addEventListener("click",()=>{appState.initialOwnAttackSide="right";renderApp();});document.getElementById("startStepNextButton").addEventListener("click",()=>{const check=validateStartStep();if(!check.valid)return displayWizardError(check);appState.sections.A.role=appState.startingAttackSection==="A"?"aanval":"verdediging";appState.sections.B.role=appState.startingAttackSection==="B"?"aanval":"verdediging";appState.matchPhase="prematch";recalculateDerivedState();persistState();renderApp();});}}
function displayWizardError(check){document.getElementById("wizardError").textContent=check.message;if(check.focusId){if(check.focusId==="matchIdInput"){const extraDetails=document.getElementById("extraMatchDetails");if(extraDetails)extraDetails.open=true;}const targetElement=document.getElementById(check.focusId);if(targetElement)targetElement.focus();}}
function bindInput(inputId,objectKey,propertyKey,callback){const inputElement=document.getElementById(inputId);inputElement.addEventListener("input",()=>{appState[objectKey][propertyKey]=inputElement.value;if(callback)callback(inputElement.value);persistState();});}

function findPlayerXgProfile(name,profile=appState.xgProfile){const n=normalizePlayerNameForProfile(name);return profile?.players?.find(p=>p.normalized_player_name===n)||null;}
function xgBand(d){return Number(d)<3?"short":Number(d)<6?"medium":"long";}
function normalizeShotToLocalPostPerspective(shot){const p=normalizeShotForAnalysis(shot);return{x_pct:p.x,y_pct:p.y,dx_m:(p.x-POST_X_PCT)/100*FIELD_METERS,dy_m:(POST_Y_PCT-p.y)/100*FIELD_METERS};}
function calculateShotAngle(shot){const p=normalizeShotToLocalPostPerspective(shot);return Math.atan2(p.dx_m,p.dy_m)*180/Math.PI;}
function calculateShotLocationCategory(angle){const a=Math.abs(Number(angle));return a<=SHOT_LOCATION_LIMITS.frontMaxDegrees?"front":a<SHOT_LOCATION_LIMITS.backMinDegrees?"side":"back";}
function getStandardXg(shot){if(shot.shot_type==="strafworp")return{value:XG_MODEL.shotType.penalty,rule:"fixed_penalty"};if(shot.shot_type==="vrije_worp")return{value:XG_MODEL.shotType.freeBall,rule:"fixed_free_ball"};if(shot.shot_type==="doorloopbal")return{value:XG_MODEL.shotType.runningIn,rule:"standard_shot_type_running_in"};const b=xgBand(shot.distance_to_post_m);return{value:XG_MODEL.distance[b],rule:"standard_distance_"+b};}
function getPersonalXg(shot,profile){if(!profile)return null;const type=profile.shot_type?.[shot.shot_type];if(type&&type.shots>=PERSONAL_XG_MIN_SAMPLE)return{value:type.goals/type.shots,rule:"personal_shot_type"};const band=profile.distance?.[xgBand(shot.distance_to_post_m)];if(band&&band.shots>=PERSONAL_XG_MIN_SAMPLE)return{value:band.goals/band.shots,rule:"personal_distance_band"};return null;}
function calculateXgForShot(shotData,playerProfile){const angle=shotData.xg_is_fixed_position?0:calculateShotAngle(shotData);const location=shotData.xg_is_fixed_position?"front":calculateShotLocationCategory(angle);const standard=getStandardXg(shotData);let value=standard.value,source="standard",rule=standard.rule;if(!["strafworp","vrije_worp"].includes(shotData.shot_type)&&playerProfile){const personal=getPersonalXg(shotData,playerProfile);if(personal){value=personal.value;source="player_profile";rule=personal.rule;}else{source="player_profile_fallback";rule="insufficient_personal_sample";}}return{xg_value:value,xg_model_version:XG_MODEL.version,xg_source:source,xg_rule:rule,xg_distance_band:xgBand(shotData.distance_to_post_m),xg_shot_type:shotData.shot_type||"overig",xg_location_category:location,xg_is_fixed_position:shotData.xg_is_fixed_position?1:0,shot_angle_degrees:angle,shot_angle_absolute_degrees:Math.abs(angle),shot_location_category:location,shot_motion_type:shotData.shot_motion_type||""};}
function getFixedShotCanonicalPosition(){return{x_pct:POST_X_PCT,y_pct:POST_Y_PCT-12.5};}
function enrichShotXg(e){if(e.event_type!=="shot")return e;if(!Number.isFinite(Number(e.distance_to_post_m))){const m=calculateShotMetrics(e.x_pct,e.y_pct,e.field_side||"left");Object.assign(e,m);}if(e.shot_type==="doorloopbal")e.shot_motion_type="dynamic";if(["vrije_worp","strafworp"].includes(e.shot_type)){const p=getFixedShotCanonicalPosition();Object.assign(e,p,{distance_to_post_m:2.5,distance_band:"0-3m",distance_band_order:1,shot_motion_type:"static",xg_is_fixed_position:1});}const player=e.own_player_name?findPlayerXgProfile(e.own_player_name):null;Object.assign(e,calculateXgForShot(e,player));return e;}
function migrateLegacyShotEvent(e){if(e.event_type!=="shot")return e;return enrichShotXg(e);}
function getTeamXgTotals(){const out={home:0,away:0};appState.events.filter(e=>e.event_type==="shot").forEach(e=>{enrichShotXg(e);const side=e.own_player_id?appState.match.my_side:(appState.match.my_side==="home"?"away":"home");out[side]+=Number(e.xg_value)||0;});return out;}
function getPlayerXgSummary(name){const shots=appState.events.filter(e=>e.event_type==="shot"&&normalizePlayerNameForProfile(e.own_player_name)===normalizePlayerNameForProfile(name)).map(enrichShotXg);const goals=shots.filter(e=>isGoalValue(e.is_goal)).length;return{name,shots:shots.length,goals,totalXg:shots.reduce((a,e)=>a+Number(e.xg_value||0),0),avgDistance:shots.length?shots.reduce((a,e)=>a+Number(e.distance_to_post_m||0),0)/shots.length:0,avgAngle:shots.length?shots.reduce((a,e)=>a+Number(e.shot_angle_absolute_degrees||0),0)/shots.length:0};}
function buildXgSummary(){const shots=appState.events.filter(e=>e.event_type==="shot").map(enrichShotXg);const totals=getTeamXgTotals();return{shots,totals,players:[...new Set(shots.filter(e=>e.own_player_name).map(e=>e.own_player_name))].map(getPlayerXgSummary)};}
function validBucket(v){return v&&Number.isInteger(v.shots)&&Number.isInteger(v.goals)&&v.shots>=0&&v.goals>=0&&v.goals<=v.shots&&Number.isFinite(v.rate)&&v.rate>=0&&v.rate<=1;}
function validateXgProfile(p){if(!p||p.profile_type!=="korfbal_xg_player_profiles"||p.profile_schema_version!==XG_PROFILE_SCHEMA_VERSION||!Array.isArray(p.players)||!Array.isArray(p.processed_match_ids))return invalid("Ongeldig of niet-ondersteund xG-profiel.");for(const pl of p.players){if(!pl.player_name||normalizePlayerNameForProfile(pl.player_name)!==pl.normalized_player_name)return invalid("xG-profiel bevat een ongeldige spelersnaam.");for(const group of [pl.distance,pl.shot_type,pl.location,pl.motion])for(const b of Object.values(group||{}))if(!validBucket(b))return invalid("xG-profiel bevat ongeldige aantallen of percentages.");}return valid();}
function importXgProfile(file){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(String(r.result));const c=validateXgProfile(p);if(!c.valid)return showToast(c.message);appState.xgProfile=p;persistState();renderApp();showToast("xG-profiel geladen.");}catch(e){showToast("xG-profiel is geen geldige JSON.");}};r.readAsText(file);}
function emptyAgg(){return{shots:0,goals:0,rate:0};}function addAgg(a,goal){a.shots++;if(goal)a.goals++;a.rate=a.shots?a.goals/a.shots:0;}
function mergeXgProfileWithMatch(){const base=appState.xgProfile?deepCopy(appState.xgProfile):{profile_schema_version:XG_PROFILE_SCHEMA_VERSION,profile_type:"korfbal_xg_player_profiles",created_at:new Date().toISOString(),model_version:XG_MODEL.version,processed_match_ids:[],players:[]};const id=appState.match.match_id;if(base.processed_match_ids.includes(id))return base;for(const e of appState.events.filter(e=>e.event_type==="shot"&&e.own_player_name)){enrichShotXg(e);const n=normalizePlayerNameForProfile(e.own_player_name);let p=base.players.find(x=>x.normalized_player_name===n);if(!p){p={player_name:e.own_player_name,normalized_player_name:n,player_gender:e.player_gender||"",total_shots:0,total_goals:0,distance:{},shot_type:{},location:{},motion:{}};base.players.push(p);}const goal=isGoalValue(e.is_goal);p.total_shots++;if(goal)p.total_goals++;for(const [g,k] of [["distance",e.xg_distance_band],["shot_type",e.shot_type||"overig"],["location",e.shot_location_category||"unknown"],["motion",e.shot_motion_type||"unknown"]]){p[g][k]??=emptyAgg();addAgg(p[g][k],goal);}}
base.processed_match_ids.push(id);base.model_version=XG_MODEL.version;return base;}
function exportXgProfile(){const p=mergeXgProfileWithMatch();downloadBlob(JSON.stringify(p,null,2),(appState.match.match_id||"korfbal")+"-xg-profiel.json","application/json");}
function profileStatusHtml(){const players=[...appState.starters,...appState.reserves].filter(p=>p.player_name);return `<section class="card"><h2>xG-profiel (optioneel)</h2><p class="mini">${appState.xgProfile?"Profiel geladen.":"Geen xG-profiel geladen. Standaardmodel actief."}</p>${players.map(p=>{const q=findPlayerXgProfile(p.player_name);return `<div class="stat-row"><span>${escapeHtml(p.player_name)}</span><strong>${q?"Profiel beschikbaar, standaard fallback mogelijk":"Standaardmodel"}</strong></div>`}).join("")}<div class="actions"><button id="loadXgProfileButton" type="button">xG-profiel laden</button>${appState.xgProfile?'<button id="removeXgProfileButton" type="button">Profiel verwijderen</button>':""}</div></section>`;}
const _startStepHtmlXg=startStepHtml;startStepHtml=function(){return profileStatusHtml()+_startStepHtmlXg();};
const _attachWizardXg=attachWizardListeners;attachWizardListeners=function(){_attachWizardXg();document.getElementById("loadXgProfileButton")?.addEventListener("click",()=>xgProfileFileInput.click());document.getElementById("removeXgProfileButton")?.addEventListener("click",()=>{appState.xgProfile=null;persistState();renderApp();});};
function fixedShotReady(){if(!["first_half","second_half"].includes(appState.matchPhase)||!appState.clock.running||appState.timeouts.active||appState.draftShot){showToast("Vaste kans is nu niet beschikbaar.");return false;}return true;}
function openFixedShotFlow(type){if(!fixedShotReady())return;const p=getFixedShotCanonicalPosition();appState.draftShot={...p,field_side:getDisplayedPhysicalFieldSide(),step:1,player_id:"",shot_type:type,shot_motion_type:"static",xg_is_fixed_position:1,fixed:true,shot_result:""};renderShotStep();}
const _renderShotStepXg=renderShotStep;renderShotStep=function(){const d=appState.draftShot;if(!d)return closeModal();if(d.fixed&&d.step===2)d.step=4;if(!d.fixed&&d.step===2){const against=appState.activePossession==="against";openModal("Type kans",`<div class="choice-list">${[["afstandsschot","Afstandsschot"],["doorloopbal","Doorloopbal"],["korte_kans","Korte kans"]].map(([v,l])=>`<button type="button" data-xg-type="${v}">${l}</button>`).join("")}</div><div class="dialog-actions"><button id="cancelShotButton" type="button">Annuleren</button></div>`,()=>{document.querySelectorAll("[data-xg-type]").forEach(b=>b.addEventListener("click",()=>{d.shot_type=b.dataset.xgType;if(d.shot_type==="doorloopbal"){d.shot_motion_type="dynamic";d.step=3;}else{d.step=4;}renderShotStep();}));document.getElementById("cancelShotButton").addEventListener("click",cancelShot);});return;}if(!d.fixed&&d.step===4&&isShotTypeRegistrationEnabled()){openModal("Beweging",`<div class="choice-list"><button type="button" data-motion="static">Static</button><button type="button" data-motion="dynamic">Dynamic</button></div><div class="dialog-actions"><button id="cancelShotButton" type="button">Annuleren</button></div>`,()=>{document.querySelectorAll("[data-motion]").forEach(b=>b.addEventListener("click",()=>{d.shot_motion_type=b.dataset.motion;d.step=3;renderShotStep();}));document.getElementById("cancelShotButton").addEventListener("click",cancelShot);});return;}_renderShotStepXg();};
const _createEventXg=createEvent;createEvent=function(type,group,details={}){if(type==="shot")enrichShotXg(details);return _createEventXg(type,group,details);};
const _restoreXg=restoreBackupFile;restoreBackupFile=function(file){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(String(r.result));if(p?.profile_type==="korfbal_xg_player_profiles")return showToast("Dit is een xG-profiel, geen wedstrijdback-up.");(p.events||[]).forEach(migrateLegacyShotEvent);}catch(e){};_restoreXg(file);};r.readAsText(file);};
function addLiveXgUi(){const t=getTeamXgTotals();const scoreIds=document.querySelectorAll(".scoreboard .score-identity .score");if(scoreIds.length===2){scoreIds[0].insertAdjacentHTML("afterend",`<div class="xg-live">xG ${formatXg(t.home)}</div>`);scoreIds[1].insertAdjacentHTML("afterend",`<div class="xg-live">xG ${formatXg(t.away)}</div>`);}const field=document.querySelector(".field-wrap");if(field&&!document.getElementById("fixedShotButtons")){const layout=document.createElement("div");layout.className="field-action-layout";field.parentNode.insertBefore(layout,field);layout.appendChild(field);layout.insertAdjacentHTML("beforeend",'<div id="fixedShotButtons" class="fixed-shot-buttons field-side-actions"><button id="freeBallButton" class="fixed-shot-action" type="button">Vrije bal</button><button id="penaltyButton" class="fixed-shot-action" type="button">Strafworp</button></div>');document.getElementById("freeBallButton").addEventListener("click",()=>openFixedShotFlow("vrije_worp"));document.getElementById("penaltyButton").addEventListener("click",()=>openFixedShotFlow("strafworp"));}}  
  const _renderLiveXg=renderLive;renderLive=function(){const r=_renderLiveXg();addLiveXgUi();if(appState.matchPhase==="finished"){const t=getTeamXgTotals();document.querySelector(".finished-screen .score")?.insertAdjacentHTML("afterend",`<div class="xg-final">xG ${formatXg(t.home)} - ${formatXg(t.away)}</div>`);const a=document.querySelector(".finished-actions");if(a){a.insertAdjacentHTML("afterbegin",'<button id="finishedXg" class="primary" type="button">xG-overzicht</button><button id="finishedProfile" type="button">xG-profiel downloaden</button>');document.getElementById("finishedXg").addEventListener("click",showXgOverview);document.getElementById("finishedProfile").addEventListener("click",exportXgProfile);}}return r;};
function rowAgg(label,arr){const g=arr.filter(e=>isGoalValue(e.is_goal)).length,x=arr.reduce((a,e)=>a+Number(e.xg_value||0),0);return `<div class="xg-row"><strong>${label}</strong><span>${arr.length} schoten</span><span>${g} goals</span><span>${percentageText(g,arr.length)}</span><span>xG ${formatXg(x)}</span></div>`;}
function xgBasisGroupHtml(title,rows){return `<section class="xg-basis-group"><h4>${escapeHtml(title)}</h4>${rows.map(([label,value])=>`<div class="xg-basis-row"><span>${escapeHtml(label)}</span><strong class="value">${formatXg(value)}</strong></div>`).join("")}</section>`;}
  function showXgOverview(){const s=buildXgSummary(),home=s.shots.filter(e=>(e.own_player_id?appState.match.my_side:(appState.match.my_side==="home"?"away":"home"))==="home"),away=s.shots.filter(e=>!home.includes(e));const own=s.shots.filter(e=>e.own_player_id);const content=`<div class="xg-grid"><section class="stat-card"><h3>Per team</h3>${rowAgg("Thuis",home)}${rowAgg("Uit",away)}</section><section class="stat-card"><h3>Per afstand</h3>${rowAgg("0-3m",s.shots.filter(e=>e.xg_distance_band==="short"))}${rowAgg("3-6m",s.shots.filter(e=>e.xg_distance_band==="medium"))}${rowAgg("6m+",s.shots.filter(e=>e.xg_distance_band==="long"))}</section><section class="stat-card"><h3>Per kanssoort</h3>${["afstandsschot","doorloopbal","korte_kans","vrije_worp","strafworp"].map(k=>rowAgg(shotTypeLabel(k),s.shots.filter(e=>e.shot_type===k))).join("")}</section><section class="stat-card"><h3>Speleranalyse</h3>${s.players.map(p=>`<button type="button" class="xg-player" data-player="${escapeHtml(p.name)}">${escapeHtml(p.name)} · ${p.goals}/${p.shots} · xG ${formatXg(p.totalXg)}</button>`).join("")||"Geen eigen schoten."}</section><section class="stat-card xg-basis-card"><h3>Basiswaarden</h3><div class="xg-basis-groups">${xgBasisGroupHtml("Afstand",[["0-3m",XG_MODEL.distance.short],["3-6m",XG_MODEL.distance.medium],["6m+",XG_MODEL.distance.long]])}${xgBasisGroupHtml("Kanssoort",[["Doorloopbal",XG_MODEL.shotType.runningIn],["Vrije bal",XG_MODEL.shotType.freeBall],["Strafworp",XG_MODEL.shotType.penalty]])}${xgBasisGroupHtml("Locatie-referentie",[["Front",XG_MODEL.locationReference.front],["Side",XG_MODEL.locationReference.side],["Back",XG_MODEL.locationReference.back]])}${xgBasisGroupHtml("Overig",[["Total",XG_MODEL.overallReference.total],["Static",XG_MODEL.overallReference.static],["Dynamic",XG_MODEL.overallReference.dynamic]])}</div><p class="mini xg-basis-note">Basis-xG-model. Front/Side/Back en Static/Dynamic worden in deze versie verzameld voor analyse en toekomstig modelgebruik, maar nog niet automatisch gecombineerd in de definitieve xG.</p></section></div><div class="dialog-actions"><button id="downloadProfileFromXg" type="button">xG-profiel downloaden</button><button id="closeXg" type="button">Sluiten</button></div>`;openModal("xG-overzicht",content,()=>{modalLayer.querySelector(".dialog").classList.add("xg-dialog");document.getElementById("closeXg").addEventListener("click",closeModal);document.getElementById("downloadProfileFromXg").addEventListener("click",exportXgProfile);document.querySelectorAll(".xg-player").forEach(b=>b.addEventListener("click",()=>showPlayerXgDetail(b.dataset.player)));});}
function showPlayerXgDetail(name){const shots=appState.events.filter(e=>e.event_type==="shot"&&normalizePlayerNameForProfile(e.own_player_name)===normalizePlayerNameForProfile(name)).map(enrichShotXg);openModal(name,`${shots.map(e=>`<div class="xg-detail"><strong>${e.match_time}</strong> · ${Number(e.distance_to_post_m).toFixed(2)}m · ${Number(e.shot_angle_degrees).toFixed(1)}° · ${e.shot_location_category} · ${e.shot_motion_type||"onbekend"} · ${shotTypeLabel(e.shot_type)} · ${isGoalValue(e.is_goal)?"Raak":"Mis"} · xG ${formatXg(e.xg_value)} · ${e.xg_source==="player_profile"?"Persoonlijk profiel":"Standaard"} · Vak ${e.section_id}</div>`).join("")||"Geen schoten."}<div class="dialog-actions"><button id="backXg" type="button">Terug</button></div>`,()=>document.getElementById("backXg").addEventListener("click",showXgOverview));}
function buildMoreMenuActions(){const analysis=appState.matchPhase!=="prematch";const canEnd=["first_half","halftime","second_half"].includes(appState.matchPhase);const actions=[{action:"backup",label:"Back-up opslaan",run:saveBackup},{action:"restore",label:"Back-up herstellen",run:()=>backupFileInput.click()},{action:"csv",label:"CSV exporteren",run:exportCsv},...(analysis?[{action:"heat",label:"Heatmap",run:openHeatmap},{action:"score",label:"Scoreverloop",run:showScoreHistory},{action:"xg",label:"xG-overzicht",run:showXgOverview}]:[]),...(canEnd?[{action:"end",label:"Wedstrijd beëindigen",run:requestEndMatch,danger:true}]:[])];return[...actions.filter(a=>!a.danger).sort((a,b)=>a.label.localeCompare(b.label,"nl-NL")),...actions.filter(a=>a.danger)];}
showMoreMenu=function(event){if(appState.timeouts.active)return showActiveTimeout();closeMoreMenu(false);moreMenuTrigger=event?.currentTarget||document.activeElement;const actions=buildMoreMenuActions();const menu=document.createElement("div");menu.className="menu";menu.setAttribute("role","menu");menu.innerHTML=actions.map(a=>`<button type="button" data-more="${a.action}" class="${a.danger?"danger menu-danger":""}">${a.label}</button>`).join("");document.body.appendChild(menu);setTimeout(()=>{document.addEventListener("pointerdown",handleMoreOutside,true);document.addEventListener("keydown",handleMoreEscape,true);},0);menu.querySelectorAll("[data-more]").forEach((button,index)=>button.addEventListener("click",()=>{const action=actions[index];closeMoreMenu();action.run();}));menu.querySelector("button")?.focus();};
function showVersionInfo(){const content=`<div class="version-current"><span class="mini">Huidige versie</span><strong>Versie ${escapeHtml(APP_VERSION)}</strong></div><div class="release-history">${RELEASE_HISTORY.map(item=>`<section class="release-item"><h3>Versie ${escapeHtml(item.version)}</h3><p class="mini">${escapeHtml(item.date)}</p><ul>${item.changes.map(change=>`<li>${escapeHtml(change)}</li>`).join("")}</ul></section>`).join("")}</div><div class="dialog-actions"><button id="closeVersionInfo" type="button">Sluiten</button></div>`;openModal("Versie-informatie",content,()=>document.getElementById("closeVersionInfo").addEventListener("click",closeModal));}
function renderFinished(){const manual=isManualFinish(),totals=getTeamXgTotals();mainContent.className="page finished-page";mainContent.innerHTML=`<section class="card finished-card"><h2>${manual?"Wedstrijd voortijdig beëindigd":"Wedstrijd afgelopen"}</h2><div class="finished-score-grid"><div class="finished-team"><strong title="${escapeHtml(appState.match.home_club)}">${escapeHtml(appState.match.home_club)}</strong><span title="${escapeHtml(appState.match.home_team)}">${escapeHtml(appState.match.home_team)}</span><b class="finished-xg">xG ${formatXg(totals.home)}</b></div><div class="finished-score">${appState.homeScore}<span>-</span>${appState.awayScore}</div><div class="finished-team finished-team-away"><strong title="${escapeHtml(appState.match.away_club)}">${escapeHtml(appState.match.away_club)}</strong><span title="${escapeHtml(appState.match.away_team)}">${escapeHtml(appState.match.away_team)}</span><b class="finished-xg">xG ${formatXg(totals.away)}</b></div></div><p class="finished-status">${manual?"De wedstrijd is voortijdig beëindigd. Alle geregistreerde gegevens zijn behouden.":"De wedstrijd is beëindigd."}</p><section class="finished-section"><h3>Analyse</h3><div class="finished-action-grid"><button id="finishedHeat" type="button">Heatmap</button><button id="finishedScoreHistory" type="button">Scoreverloop</button><button id="finishedXg" type="button">xG-overzicht</button></div></section><section class="finished-section"><h3>Export en back-up</h3><div class="finished-action-grid"><button id="finishedBackup" type="button">Back-up opslaan</button><button id="finishedCsv" type="button">CSV exporteren</button><button id="finishedProfile" type="button">xG-profiel downloaden</button></div></section><button id="newMatch" class="primary finished-primary-action" type="button">Nieuwe wedstrijd</button><button id="finishedMore" class="quiet finished-more-action" type="button">Meer</button></section>`;document.getElementById("finishedHeat").addEventListener("click",openHeatmap);document.getElementById("finishedScoreHistory").addEventListener("click",showScoreHistory);document.getElementById("finishedXg").addEventListener("click",showXgOverview);document.getElementById("finishedBackup").addEventListener("click",saveBackup);document.getElementById("finishedCsv").addEventListener("click",exportCsv);document.getElementById("finishedProfile").addEventListener("click",exportXgProfile);document.getElementById("newMatch").addEventListener("click",confirmNewMatch);document.getElementById("finishedMore").addEventListener("click",showMoreMenu);}
const _renderLiveRelease=renderLive;renderLive=function(){if(appState.matchPhase==="finished")return renderFinished();return _renderLiveRelease();};
xgProfileFileInput.addEventListener("change",()=>{if(xgProfileFileInput.files?.[0])importXgProfile(xgProfileFileInput.files[0]);xgProfileFileInput.value="";});
const _recalcXg=recalculateDerivedState;recalculateDerivedState=function(){(appState.events||[]).forEach(migrateLegacyShotEvent);return _recalcXg();};
const _selfXg=runSelfTests;runSelfTests=function(){_selfXg();const eq=(a,b)=>Math.abs(a-b)<1e-12;[["strafworp",2.5,.83],["vrije_worp",2.5,.31],["doorloopbal",4,.39],["",2.99,.27],["",3,.21],["",5.99,.21],["",6,.16]].forEach(([shot_type,distance_to_post_m,w])=>{if(!eq(calculateXgForShot({shot_type,distance_to_post_m,x_pct:50,y_pct:50},null).xg_value,w))throw new Error("xG-regel mislukt");});if(CSV_COLUMNS.length!==117)throw new Error("CSV xG-schema mislukt");if(normalizePlayerNameForProfile(" Koen  Barhorst ")!==normalizePlayerNameForProfile("KOEN BARHORST"))throw new Error("Naamnormalisatie mislukt");if(findPlayerXgProfile("Koen",{players:[{normalized_player_name:"koen barhorst"}]})!==null)throw new Error("Fuzzy match actief");};

initializeApp();
})();
