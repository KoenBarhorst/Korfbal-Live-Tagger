    function buildDidYouKnowFacts(p){const c=[];if(p.for.shots){const top=p.shotTypesFor.rows.slice().sort((a,b)=>b.shots-a.shots)[0];if(top?.shots)c.push({score:top.shots*10,cat:1,text:`${Math.round(top.shots/p.for.shots*100)}% van de kansen van ${p.name} waren ${top.label.toLowerCase()} (${top.shots} van ${p.for.shots}).`});c.push({score:p.for.shots*6,cat:7,text:`${p.for.goals} goals uit ${formatXg(p.for.xg)} xG, een verschil van ${nlSigned(p.for.diff)}.`});const fast=p.timeFor[0];if(fast.shots)c.push({score:fast.shots*5,cat:6,text:`${Math.round(fast.shots/p.for.shots*100)}% van de kansen kwam binnen 10 seconden na de start van de aanval.`});}if(p.against.shots)c.push({score:p.against.shots*7,cat:8,text:`Tegen ${p.name} als verdediger scoorde de tegenstander ${p.against.goals} keer uit ${p.against.shots} kansen (${Math.round(p.against.goals/p.against.shots*100)}%).`});return c.sort((a,b)=>b.score-a.score||a.cat-b.cat).filter((x,i,a)=>a.findIndex(y=>y.cat===x.cat)===i).slice(0,3).map(x=>x.text);}
    function historicalDataQuality(team){const s=team.selection,all=s.shots;return{missingType:all.filter(e=>!e.shot_type).length,forMissingPlayer:s.forShots.filter(e=>!e.own_player_id&&!e.own_player_name).length,againstMissingDefender:s.againstShots.filter(e=>!e.defender_player_id&&!e.defender_player_name).length,missingAttack:all.filter(e=>!e.attack_id).length,missingXg:all.filter(e=>!Number.isFinite(Number(e.xg_value))).length,missingPosition:all.filter(e=>!Number.isFinite(Number(e.x_pct))||!Number.isFinite(Number(e.y_pct))).length,unknownSide:s.unknownShots.length};}
    function buildHistoricalReportModel(matches){const team=buildTeamAnalysis(matches),players=buildPlayerAnalysis(matches).map(p=>{const d=buildSinglePlayerAnalysis(p.key,matches);d.facts=buildDidYouKnowFacts(d);return d;});const dates=matches.map(m=>m.match?.match_date).filter(Boolean).sort();return{matches:matches.slice(),team,players,dates,period:dates.length?`${dates[0]}${dates.length>1?` t/m ${dates[dates.length-1]}`:""}`:"Onbekend",quality:historicalDataQuality(team),estimatedPages:3+players.length};}
    function aggRowsHtml(rows,defense=false){return`<div class="analysis-table"><div class="tr head"><span>Onderdeel</span><span>Kansen</span><span>Goals</span><span>%</span><span class="optional">xG</span><span class="optional">G-xG</span></div>${rows.map(r=>`<div class="tr ${r.label==="Totaal"?"total":""}"><span>${escapeHtml(r.label)}</span><span>${r.shots}</span><span>${r.goals}</span><span>${histPct(r.goals,r.shots)}</span><span class="optional">${formatXg(r.xg)}</span><span class="optional">${nlSigned(r.diff)}</span></div>`).join("")}</div>`;}

    function compareHtml(t){const rows=[["Goals",t.for.goals,t.against.goals],["xG",formatXg(t.for.xg),formatXg(t.against.xg)],["Schoten",t.for.shots,t.against.shots],["Schotpercentage",histPct(t.for.goals,t.for.shots,true),histPct(t.against.goals,t.against.shots,true)],["Goals - xG",nlSigned(t.for.diff),nlSigned(t.against.diff)],["Gem. xG per schot",t.for.shots?formatXg(t.for.avgXg):"-",t.against.shots?formatXg(t.against.avgXg):"-"],["Aanvallen",t.for.attacks,t.against.attacks],["Goals per aanval",t.for.attacks?formatXg(t.for.goals/t.for.attacks):"-",t.against.attacks?formatXg(t.against.goals/t.against.attacks):"-"],["Aanvallen met goal",histPct(t.for.attacksWithGoal,t.for.attacks,true),histPct(t.against.attacksWithGoal,t.against.attacks,true)]];return`<div class="history-compare"><div class="head">Kengetal</div><div class="head value">Voor</div><div class="head value">Tegen</div>${rows.map(r=>`<div>${r[0]}</div><div class="value">${r[1]}</div><div class="value">${r[2]}</div>`).join("")}</div><div class="history-saldi">${[["Doelsaldo",t.for.goals-t.against.goals],["xG-saldo",nlSigned(t.for.xg-t.against.xg)],["Afwerkingsverschil voor",nlSigned(t.for.diff)],["Afwerkingsverschil tegen",nlSigned(t.against.diff)]].map(x=>`<div class="metric-card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div>`;}
    function zoneColor(z,mode,max){if(!z.shots)return"transparent";if(mode==="shots"){const a=.12+.55*(z.shots/(max||1));return`rgba(67,167,214,${a})`;}if(mode==="xg")return`rgba(107,177,120,${.12+.55*(z.xg/(max||1))})`;const p=z.goals/z.shots*100;return p<10?"rgba(196,75,75,.45)":p<20?"rgba(220,143,56,.48)":p<30?"rgba(164,183,74,.5)":p<40?"rgba(84,164,100,.52)":"rgba(55,196,105,.62)";}
    function zoneValue(z,mode){if(!z.shots)return"-";if(mode==="shots")return String(z.shots);if(mode==="xg")return formatXg(z.xg);return`${Math.round(z.goals/z.shots*100)}%${z.shots<3?"*":""}`;}
    function zoneMapSvg(analysis,mode,title,print=false){const max=Math.max(1,...analysis.zones.map(z=>mode==="xg"?z.xg:z.shots));const centers={"0-3m":7.5,"3-6m":22.5,"6-9m":37.5,"9m+":49},angles={"Voor":0,"Voor-rechts":45,"Rechts":90,"Achter-rechts":135,"Achter":180,"Achter-links":-135,"Links":-90,"Voor-links":-45};let overlays="";analysis.zones.forEach(z=>{const a=angles[z.direction]*Math.PI/180,r=centers[z.band],x=POST_X_PCT+Math.sin(a)*r,y=POST_Y_PCT-Math.cos(a)*r;overlays+=`<circle cx="${x}" cy="${y}" r="5.2" fill="${zoneColor(z,mode,max)}" stroke="rgba(255,255,255,.18)"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="${print?'#111':'#fff'}" font-size="3.1" font-weight="800">${zoneValue(z,mode)}</text>`;});const base=liveFieldSvg({side:"left",interactive:false,role:""}).replace('id="analysisCourtSvg"','').replace('<g class="analysis-layer"></g>',`<g opacity=".35" stroke="#7aa6c9" stroke-width=".3">${[0,45,90,135,180,225,270,315].map(d=>{const a=d*Math.PI/180;return`<line x1="${POST_X_PCT}" y1="${POST_Y_PCT}" x2="${POST_X_PCT+Math.sin(a)*70}" y2="${POST_Y_PCT-Math.cos(a)*70}"/>`;}).join("")}</g><g>${overlays}</g>`);return`<div class="zone-map" role="img" aria-label="${escapeHtml(title)}, ${analysis.total} kansen">${base}</div>`;}
    function zoneCardsHtml(analysis,mode,side,person=""){const shoot=side==="for"?(person?`Waar ${person} schiet`:"Waar wij schieten"):(person?`Waar tegen ${person} wordt geschoten`:"Waar de tegenstander schiet"),score=side==="for"?(person?`Waar ${person} scoort`:"Waar wij scoren"):(person?`Waar tegen ${person} wordt gescoord`:"Waar de tegenstander scoort");return`<div class="zone-cards"><section class="card zone-card"><h3>${escapeHtml(shoot)}</h3>${zoneMapSvg(analysis,mode,shoot)}</section><section class="card zone-card"><h3>${escapeHtml(score)}</h3>${zoneMapSvg(analysis,"pct",score)}</section></div><p class="zone-note">Kleurintensiteit bij kansen en xG is relatief aan de huidige selectie. * Kleine steekproef: minder dan 3 kansen. Vaste kansen worden op hun vaste registratiepositie weergegeven.</p><details class="zone-values"><summary>Zonewaarden tekstueel</summary>${analysis.zones.filter(z=>z.shots).map(z=>`<div class="stat-row"><span>${z.band} · ${z.direction}</span><strong>${z.shots} kansen · ${histPct(z.goals,z.shots,true)} · xG ${formatXg(z.xg)}</strong></div>`).join("")||"Geen geldige posities."}</details>`;}

    function sectionCardHtml(s){const row=(label,x)=>`<div class="stat-row"><span>${label}</span><strong>${x}</strong></div>`;return`<section class="card"><h2>Vak ${s.sectionId}</h2><div class="analysis-pairs"><div><h3>Aanval</h3>${row("Afgesloten aanvallen",s.for.attacks)}${row("Kansen",s.for.shots)}${row("Goals",s.for.goals)}${row("xG",formatXg(s.for.xg))}${row("Schotpercentage",histPct(s.for.goals,s.for.shots,true))}${row("Goals per aanval",s.for.goalsPerAttack===null?"-":formatXg(s.for.goalsPerAttack))}${row("xG per aanval",s.for.xgPerAttack===null?"-":formatXg(s.for.xgPerAttack))}${row("Aanvallen met goal",histPct(s.for.attacksWithGoal,s.for.attacks,true))}</div><div><h3>Verdediging</h3>${row("Afgesloten aanvallen tegen",s.against.attacks)}${row("Kansen tegen",s.against.shots)}${row("Goals tegen",s.against.goals)}${row("xG tegen",formatXg(s.against.xg))}${row("Schotpercentage tegen",histPct(s.against.goals,s.against.shots,true))}${row("Goals tegen per aanval",s.against.goalsPerAttack===null?"-":formatXg(s.against.goalsPerAttack))}${row("xG tegen per aanval",s.against.xgPerAttack===null?"-":formatXg(s.against.xgPerAttack))}${row("Aanvallen met tegengoal",histPct(s.against.attacksWithGoal,s.against.attacks,true))}</div></div></section>`;}

    function renderZonesTab(model){const z=historicalAnalysisState.zone||{side:"for",mode:"shots",section:"all",gender:"all",player:"all",shotType:"all",period:"all"};historicalAnalysisState.zone=z;const source=z.side==="for"?model.team.selection.forShots:model.team.selection.againstShots,genderKey=z.side==="for"?"player_gender":"defender_gender",nameKey=z.side==="for"?"own_player_name":"defender_player_name";let shots=source.filter(e=>z.section==="all"||e.section_id===z.section).filter(e=>z.gender==="all"||e[genderKey]===z.gender).filter(e=>z.player==="all"||normalizePlayerNameForProfile(e[nameKey])===z.player).filter(e=>z.shotType==="all"||(e.shot_type||"unknown")===z.shotType).filter(e=>z.period==="all"||Number(e.half)===Number(z.period));const analysis=buildZoneAnalysis(shots),names=[...new Map(source.filter(e=>e[nameKey]).map(e=>[normalizePlayerNameForProfile(e[nameKey]),e[nameKey]])).entries()].sort((a,b)=>a[1].localeCompare(b[1],"nl-NL"));return`<section class="card"><h2>Zones</h2><div class="zone-controls"><label>Zijde<select data-zone="side"><option value="for" ${z.side==="for"?"selected":""}>Aanvallend</option><option value="against" ${z.side==="against"?"selected":""}>Verdedigend</option></select></label><label>Weergave<select data-zone="mode"><option value="shots" ${z.mode==="shots"?"selected":""}>Kansen</option><option value="pct" ${z.mode==="pct"?"selected":""}>Schot%</option><option value="xg" ${z.mode==="xg"?"selected":""}>xG</option></select></label><label>Vak<select data-zone="section"><option value="all">Beide</option><option value="A" ${z.section==="A"?"selected":""}>Vak A</option><option value="B" ${z.section==="B"?"selected":""}>Vak B</option></select></label><label>D/H<select data-zone="gender"><option value="all">Alle</option><option value="D" ${z.gender==="D"?"selected":""}>D</option><option value="H" ${z.gender==="H"?"selected":""}>H</option></select></label><label>${z.side==="for"?"Speler":"Verdediger"}<select data-zone="player"><option va
